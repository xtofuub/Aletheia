[package]
name = "aletheia"
version = "0.1.10"
description = "Local-only defensive data investigation workspace"
authors = ["xtofuub <99559348+xtofuub@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.88"
homepage = "https://github.com/xtofuub/Aletheia"
repository = "https://github.com/xtofuub/Aletheia"

[lib]
name = "aletheia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
aho-corasick = "1.1.4"
blake3 = "1.8.5"
chardetng = "1.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
encoding_rs = "0.8.35"
flate2 = "1.1.9"
memchr = "2.7.6"
once_cell = "1.21.4"
psl = "2.1.223"
regex = "1.13.1"
rars = "0.4.7"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tantivy = "0.26.1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.4.3"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "v7", "serde"] }
walkdir = "2.5.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd", "lzma"] }

[dev-dependencies]
base64 = "0.22.1"
criterion = "0.7.0"
ico = "0.5.0"
minisign-verify = "0.2.5"
tempfile = "3.24.0"

[[bench]]
name = "core_benchmarks"
harness = false

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
